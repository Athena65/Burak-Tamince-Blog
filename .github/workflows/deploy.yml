name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Daily rebuild so the GitHub panel's numbers stay current without any commit.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Copy assets to public
        run: |
          if [ -d "./assets" ]; then
            cp -r ./assets/* ./public/assets/ 2>/dev/null || true
          fi

      # Writes public/data/github-stats.json straight into the build. Nothing is
      # committed, so the branch ruleset on main is never involved, and the
      # script exits 0 on failure so a stats hiccup can never fail a deploy.
      - name: Refresh GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
        run: node scripts/fetch-github-stats.mjs

      - name: Build
        run: npm run build

      - name: Ensure .nojekyll exists in dist
        run: |
          touch dist/.nojekyll
          if [ -f "public/.nojekyll" ]; then
            cp public/.nojekyll dist/.nojekyll
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

